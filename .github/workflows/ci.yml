# Continuous integration (T-034). Runs the same checks as a local checkpoint.
# It needs no secret and deploys nothing. The backend uses its SQLite
# development substitute with per-run test keys (backend/config/settings.py).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test parakh

  mobile:
    name: Mobile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # tsc, ESLint (console.* is an error), Prettier, Jest. The live contract test skips itself here.
      - run: npm run check

  tracker:
    name: Tracker and requirement index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/extract_requirements.py --check
      - run: python scripts/generate_tracker.py --check
      - run: python scripts/generate_tracker.py --validate
      - run: python -m unittest discover -s tests/tracking -v
